packages:
  - 'apps/*'
  - 'packages/*'
publicHoistPattern:
  - '@electron-forge/*'
  - '@electron/*'
  - 'electron*'
minimumReleaseAge: 10080 # 7 days
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@arcanewizards/apis@0.1.0'
  - '@arcanewizards/sigil@0.6.1'
  - '@arcanejs/react-toolkit@0.16.6'
allowBuilds:
  '@arcanewizards/electron-media-service': true
  '@arcanewizards/midi': true
  '@arcanewizards/net-utils-native': true
  '@parcel/watcher': true
  electron: true
  electron-winstaller: true
  esbuild: false
  fs-xattr: true
  lzma-native: true
  macos-alias: true
  unrs-resolver: true
overrides:
  '@electron/rebuild': 4.0.4
  '@tootallnate/once@<3.0.1': ^3.0.1
  tar@<7.5.7: ^7.5.7
  tar@<7.5.8: ^7.5.8
  tar@<=7.5.10: ^7.5.11
  tar@<=7.5.2: ^7.5.3
  tar@<=7.5.3: ^7.5.4
  tar@<=7.5.9: ^7.5.10
  tmp@<=0.2.3: ^0.2.4

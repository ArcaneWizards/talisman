<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_2" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 1220">
  <style>
    * {
      transform-origin: 610px 610px;
    }
    
    @keyframes color-change {
      0% {
        fill: #ef5350ff;
      }
      16.6% {
        fill: #efef50ff;
      }
      33.3% {
        fill: #50ef50ff;
      }
      50% {
        fill: #50efefff;
      }
      66.6% {
        fill: #5050efff;
      }
      83.3% {
        fill: #ef50efff;
      }
      100% {
        fill: #ef5350ff;
      }
    }

    #button_n {
      animation: color-change 20s linear infinite;
    }

    #button_e {
      animation: color-change 20s -5s linear infinite;
    }

    #button_s {
      animation: color-change 20s -10s linear infinite;
    }

    #button_w {
      animation: color-change 20s -15s linear infinite;
    }

    @keyframes flash {
      0% {
        fill: rgba(255, 255, 255, 0);
      }
      10% {
        fill: rgba(255, 255, 255, 0);
      }
      12% {
        fill: rgba(255, 255, 255, 1);
      }
      14% {
        fill: rgba(255, 255, 255, 0);
      }
      100% {
        fill: rgba(255, 255, 255, 0);
      }
    }

    #button_n_flash {
      animation: flash 5s linear infinite;
    }

    #button_e_flash {
      animation: flash 5s 0.5s linear infinite;
    }

    #button_s_flash {
      animation: flash 5s 1s linear infinite;
    }

    #button_w_flash {
      animation: flash 5s 1.5s linear infinite;
    }

  </style>
